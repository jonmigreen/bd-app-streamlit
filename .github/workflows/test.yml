name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Tiers 1 and 2 are hermetic: the OpenAI SDK is mocked and the app's
      # client is a fake, so no API key or network access is needed.
      # scripts/smoke_live_api.py is deliberately NOT run here.
      - name: Run tests
        run: python -m pytest
